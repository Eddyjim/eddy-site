projects:
  - id: policy-ai-agent
    title: Insurance Policy AI Agent
    description: >-
      Built an AI agent on the BriteCore SaaS platform that produces
      summarized views of insurance policies, reducing the time end users
      spend on manual policy lookups. Includes the agent harness, RAG
      retrieval over policy data and Langfuse tracing and evaluation.
    technologies:
      - Python
      - LLM
      - LangChain
      - RAG
      - Langfuse
      - AWS
      - FastAPI
    url: ""
    featured: true

  - id: serverless-lti-integration
    title: Serverless LTI Integration
    description: >-
      Migrated LMS integration to a serverless stack using AWS Cloud Services,
      including the deployment pipelines. Enabled scalable, cost-effective
      integration between learning management systems.
    technologies:
      - AWS Lambda
      - API Gateway
      - DynamoDB
      - Step Functions
      - Python
    url: ""
    featured: true

  - id: monolith-split
    title: Monolith Split
    description: >-
      Built the proof-of-concept that validated migrating an MVC monolith
      into an event-based cloud architecture, then joined the implementation
      team for the broader rollout that improved scalability and
      maintainability.
    technologies:
      - Python
      - AWS
      - Docker
      - Kubernetes
      - PostgreSQL
    url: ""
    featured: true
