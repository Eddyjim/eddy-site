services:
  - name: Desarrollo Full-Stack
    slug: full-stack-development
    description: Desarrollo de aplicaciones web de extremo a extremo con Python, JavaScript y frameworks modernos como Vue, React, Flask y FastAPI.
    icon: bi-code-slash

  - name: Arquitectura Cloud y Serverless
    slug: cloud-architecture
    description: Diseño e implementación de sistemas escalables cloud-native en AWS, incluyendo arquitecturas serverless con Lambda, API Gateway y Step Functions.
    icon: bi-cloud

  - name: DevOps y CI/CD
    slug: devops-cicd
    description: Contenerización con Docker y Kubernetes, pipelines de despliegue automatizados con GitHub Actions e infraestructura como código con Terraform.
    icon: bi-gear

  - name: Arquitectura y Migración
    slug: architecture-migration
    description: Migración de monolitos a microservicios, diseño de arquitectura basada en eventos y modernización de sistemas legados con más de 10 años de experiencia.
    icon: bi-diagram-3

  - name: BPM y Optimización de Procesos
    slug: bpm-process-optimization
    description: "Análisis de procesos de negocio, modelado BPMN e implementación en plataformas BPM, además de SOA e integración empresarial en sistemas bancarios, de gobierno y de seguros."
    icon: bi-diagram-2

  - name: Ingeniería de IA y Agentes
    slug: ai-agent-engineering
    description: "Diseño y entrega de sistemas basados en LLM: servidores MCP, orquestación multi-agente con LangGraph y evaluación instrumentada con Langfuse — construidos spec-first para que el comportamiento sea reproducible."
    icon: bi-robot
